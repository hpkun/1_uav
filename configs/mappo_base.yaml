algorithm: mappo
seed: 1
device: auto
num_envs: 4
vector_env: parallel
rollout_length: 128
total_env_steps: 1000000
evaluation_interval: 20000
validation_seed_start: 100000
validation_episodes: 100
test_seed_start: 200000
test_episodes: 200
checkpoint_selection: smoke
checkpoint_interval: 50000
run_symmetric_stress_test: false
log_interval: 1
deterministic_evaluation: true
gamma: 0.99
gae_lambda: 0.95
clip_param: 0.2
value_clip_param: 0.2
ppo_epochs: 10
num_mini_batches: 4
actor_lr: 0.0005
critic_lr: 0.0005
entropy_coef: 0.01
value_loss_coef: 1.0
max_grad_norm: 10.0
use_huber_loss: true
huber_delta: 10.0
normalize_advantages: true
use_clipped_value_loss: true
linear_lr_decay: true
use_value_normalization: true
activation: relu
actor_hidden_sizes: [128, 128]
critic_hidden_sizes: [256, 256]
environment:
  kind: 1v1
  scenario: tail_chase
  opponent: straight
