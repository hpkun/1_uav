algorithm: happo
reward_mode: joint_team
share_actor_parameters: false
fixed_agent_order: false
seed: 1
device: auto
num_envs: 4
vector_env: parallel
rollout_length: 128
total_env_steps: 1000000
evaluation_interval: 20000
validation_seed_start: 100000
validation_episodes: 20
test_seed_start: 200000
test_episodes: 20
checkpoint_selection: smoke
checkpoint_interval: 50000
deterministic_evaluation: true
gamma: 0.99
gae_lambda: 0.95
actor_lr: 0.0005
critic_lr: 0.0005
optimizer_eps: 1.0e-5
weight_decay: 0.0
clip_param: 0.2
value_clip_param: 0.2
ppo_epochs: 5
actor_num_mini_batches: 1
critic_epochs: 5
critic_num_mini_batches: 1
entropy_coef: 0.01
value_loss_coef: 1.0
max_grad_norm: 10.0
normalize_advantages: true
use_value_normalization: true
use_clipped_value_loss: true
use_huber_loss: true
huber_delta: 10.0
activation: relu
actor_hidden_sizes: [128, 128]
critic_hidden_sizes: [256, 256]
environment:
  kind: 3v3
  scenario: head_on_learnability_v1
  opponent: straight
  multi_terminal_reward_profile: paper_2024_exact
