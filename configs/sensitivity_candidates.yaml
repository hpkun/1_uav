status: CANDIDATE ONLY - NOT PAPER VALUE
usage: Apply one profile from one group to the canonical reconstruction.

weapon:
  weapon_weak:
    environment:
      weapon: {distance_min: 1000.0}
      reproduction_assumptions:
        weapon: {d_hit: 1000.0, c4: 0.10, c5: 0.10}
  weapon_nominal:
    environment:
      weapon: {distance_min: 0.0}
      reproduction_assumptions:
        weapon: {d_hit: 2000.0, c4: 0.05, c5: 0.05}
  weapon_strong:
    environment:
      weapon: {distance_min: 0.0}
      reproduction_assumptions:
        weapon: {d_hit: 4000.0, c4: 0.01, c5: 0.01}

sensor:
  sensor_low:
    environment:
      reproduction_assumptions:
        sensor: {c1: 5.0, c2: 0.005, c3: 0.5, b1: 3.0, b2: 3.0, b3: 3.0}
  sensor_nominal:
    environment:
      reproduction_assumptions:
        sensor: {c1: 10.0, c2: 0.01, c3: 1.0, b1: 3.0, b2: 3.0, b3: 3.0}
  sensor_high:
    environment:
      reproduction_assumptions:
        sensor: {c1: 20.0, c2: 0.02, c3: 2.0, b1: 3.0, b2: 3.0, b3: 3.0}

controller:
  controller_slow:
    environment:
      reproduction_assumptions:
        controller:
          {k_yaw: 0.5, k_pitch: 0.5, k_speed: 0.5, yaw_rate_max: 0.5,
           pitch_rate_max: 0.35, acceleration_max: 25.0, nx_min: -2.0,
           nx_max: 2.0, nz_min: -4.0, nz_max: 4.0}
  controller_nominal:
    environment:
      reproduction_assumptions:
        controller:
          {k_yaw: 1.0, k_pitch: 1.0, k_speed: 1.0, yaw_rate_max: 1.0,
           pitch_rate_max: 0.7, acceleration_max: 50.0, nx_min: -3.0,
           nx_max: 3.0, nz_min: -6.0, nz_max: 6.0}
  controller_fast:
    environment:
      reproduction_assumptions:
        controller:
          {k_yaw: 1.5, k_pitch: 1.5, k_speed: 1.5, yaw_rate_max: 1.5,
           pitch_rate_max: 1.0, acceleration_max: 75.0, nx_min: -4.0,
           nx_max: 4.0, nz_min: -8.0, nz_max: 8.0}

scheduler:
  scheduler_sparse:
    algorithm:
      reproduction_assumptions:
        {steps_per_update: 48, update_steps_n: 1, policy_delay_d: 2}
  scheduler_nominal:
    algorithm:
      reproduction_assumptions:
        {steps_per_update: 24, update_steps_n: 1, policy_delay_d: 2}
  scheduler_dense:
    algorithm:
      reproduction_assumptions:
        {steps_per_update: 24, update_steps_n: 2, policy_delay_d: 1}
