algorithm: MADSAC
network:
  observation_dim: 45
  action_dim: 3
  num_agents: 4
  actor_hidden_layers: [256, 256]
  critic_hidden_layers: [256, 256]
  attention_heads: 2
training:
  optimizer: Adam
  learning_rate: 0.0001
  replay_buffer_size: 1000000
  batch_size: 1024
  tau: 0.001
  gamma: 0.99
  alpha: 0.1
  num_train_envs: 24
  total_env_steps: 8000001
  evaluation_episodes: 20
  independent_training_runs: 5
  confidence_interval: 0.95
reproduction_assumptions:
  policy_delay: 2
  learning_starts: 1024
  updates_per_environment_step: 1
  evaluation_interval_training_cycles: 2
