algorithm: MADSAC
network:
  observation_dim: 45
  action_dim: 3
  num_agents: 4
  actor_hidden_layers: [256, 256]
  critic_hidden_layers: [256, 256]
  attention_heads: 2
training:
  optimizer: Adam
  learning_rate: 0.0001
  replay_buffer_size: 1000000
  batch_size: 1024
  tau: 0.001
  gamma: 0.99
  alpha: 0.1
  num_train_envs: 24
  total_env_steps: 8000001
  evaluation_episodes: 20
  independent_training_runs: 5
  confidence_interval: 0.95
  device: cpu
  seed: 0
  output_dir: outputs/madsac
  evaluation_interval_env_steps: 100000
reproduction_assumptions:
  actor_activation: relu
  log_std_min: -5.0
  log_std_max: 2.0
  critic_activation: leaky_relu
  critic_embedding_layers: 2
  critic_head_dimension_split: equal
  policy_delay: 2
  learning_starts: 1024
  updates_per_transition: 1.0
  seed_stride: 100000
  evaluation_seed_base: 10000000
  resume_vector_env_behavior: reset_all_envs_deterministically
