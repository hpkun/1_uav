[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-env"
version = "0.1.0"
description = "Lightweight 3D UAV close-combat environment foundation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "gymnasium",
  "pyyaml",
  "matplotlib",
  "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
