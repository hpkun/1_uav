[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-interception"
version = "1.0.0"
description = "Three-dimensional cooperative UAV interception and pursuit-evasion with MAPPO"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.0", "plotly>=5.18", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["env*", "algorithm*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
junit_family = "xunit1"
