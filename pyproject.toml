[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coop3d"
version = "1.0.0"
description = "Xu APH-MAPPO 3D multi-UAV air combat and historical inspection benchmark"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6.0", "torch>=2.0", "plotly>=5.18", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["env*", "algorithm*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
junit_family = "xunit1"
